[project]
name = "ntfields"
version = "0.1.0.dev0"
description = "Physics-informed neural travel-time fields for motion planning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.10",
    "numpy>=1.26",
    "torch>=2.4",
]

[project.optional-dependencies]
arm = ["pytorch-kinematics>=0.7"]
cli = ["tyro>=0.9"]
gt = ["scikit-fmm>=2024.5.29"]
# AMD GPUs (RX 9060 XT, gfx1200): `uv sync --extra rocm`. torch and its bundled ROCm runtime come from AMD's index;
# they are listed here so that the sources below apply to them.
rocm = [
    "torch[device-gfx1200]>=2.4",
    "triton",
    "rocm",
    "rocm-bootstrap",
    "rocm-sdk-core",
    "rocm-sdk-libraries",
    "rocm-sdk-device-gfx1200",
    "amd-torch-device-gfx1200",
    "amd-torch-device-gfx12-0",
]

[project.scripts]
ntfields = "ntfields.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytorch-kinematics>=0.7",
    "ruff>=0.14",
    "scikit-fmm>=2024.5.29",
    "tyro>=0.9",
]

[build-system]
requires = ["uv_build>=0.9,<0.11"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "amd-rocm"
url = "https://stable.repo.amd.com/rocm/whl-next/"
explicit = true # only the packages pinned below come from here

[tool.uv.sources]
# with the rocm extra, these come from AMD; without it, torch and triton come from PyPI as before
torch = { index = "amd-rocm", extra = "rocm" }
triton = { index = "amd-rocm", extra = "rocm" }
rocm = { index = "amd-rocm", extra = "rocm" }
rocm-bootstrap = { index = "amd-rocm", extra = "rocm" }
rocm-sdk-core = { index = "amd-rocm", extra = "rocm" }
rocm-sdk-libraries = { index = "amd-rocm", extra = "rocm" }
rocm-sdk-device-gfx1200 = { index = "amd-rocm", extra = "rocm" }
amd-torch-device-gfx1200 = { index = "amd-rocm", extra = "rocm" }
amd-torch-device-gfx12-0 = { index = "amd-rocm", extra = "rocm" }

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]
ignore = ["ANN401"]
allowed-confusables = ["α", "γ"]  # the papers' symbols

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["tests/private"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:input's size at dim=0 does not match num_features:UserWarning"]  # ntrl-demo's InstanceNorm1d
